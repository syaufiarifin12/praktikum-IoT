<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Dashboard - REST API</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; color: #333; }
.container { max-width: 1000px; margin: 0 auto; }
h1 { color: white; text-align: center; margin-bottom: 25px; font-size: 28px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
.card, .panel { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
.card { text-align: center; }
.panel { margin-bottom: 25px; }
.card .label { font-size: 14px; color: #888; letter-spacing: 1px; }
.card .value { font-size: 42px; font-weight: bold; margin: 10px 0; color: #667eea; }
.card .unit { font-size: 18px; color: #aaa; }
.status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
.status-online { background: #d4edda; color: #155724; }
.status-offline { background: #f8d7da; color: #721c24; }
.panel h2 { font-size: 18px; margin-bottom: 15px; color: #444; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn { padding: 12px 30px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; color: white; }
.btn-on { background: #28a745; } .btn-off { background: #dc3545; } .btn-set { background: #667eea; }
.btn:hover { filter: brightness(.9); }
input[type=number] { padding: 11px; border: 1px solid #ccc; border-radius: 10px; width: 120px; font-size: 15px; }
#alert { display: none; background: #fff3cd; color: #856404; border-left: 6px solid #e8590c; border-radius: 10px; padding: 14px 18px; margin-bottom: 25px; font-weight: 600; }
.chart-box { position: relative; height: 270px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
th { background: #f8f9fa; color: #666; font-size: 12px; }
#log { background: #1e1e1e; color: #0f0; font-family: monospace; padding: 15px; border-radius: 10px; max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
#log .error { color: #f66; } #log .info { color: #6af; } #log .warn { color: #fc3; }
</style>
</head>
<body>
<div class="container">
  <h1>IoT Dashboard — REST API</h1>

  <div id="alert"></div>

  <div class="cards">
    <div class="card"><div class="label">Suhu</div><div class="value" id="suhu">--</div><div class="unit">°C</div></div>
    <div class="card"><div class="label">Kelembaban</div><div class="value" id="kelembaban">--</div><div class="unit">%</div></div>
    <div class="card">
      <div class="label">Status Sensor</div>
      <div class="value" style="font-size:22px;"><span class="status-badge status-offline" id="status-badge">OFFLINE</span></div>
      <div class="unit" style="font-size:13px;">Koneksi: <span id="conn">polling</span></div>
    </div>
  </div>

  <div class="panel">
    <h2>Grafik Real-time</h2>
    <div class="chart-box"><canvas id="chart"></canvas></div>
  </div>

  <div class="panel">
    <h2>Kontrol Perangkat</h2>
    <div class="row">
      <button class="btn btn-on" onclick="kontrol('lamp','on')">Nyalakan Lampu</button>
      <button class="btn btn-off" onclick="kontrol('lamp','off')">Matikan Lampu</button>
    </div>
  </div>

  <div class="panel">
    <h2>Batas Suhu (Threshold)</h2>
    <div class="row">
      <input type="number" id="th-input" step="0.1" placeholder="mis. 30">
      <button class="btn btn-set" onclick="setThreshold()">Simpan batas</button>
      <span id="th-now" style="color:#666;">Batas aktif: belum diset</span>
    </div>
  </div>

  <div class="panel">
    <h2>10 Data Sensor Terakhir</h2>
    <table>
      <thead><tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr></thead>
      <tbody id="history-body"><tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr></tbody>
    </table>
  </div>

  <div class="panel"><h2>Log Aktivitas</h2><div id="log"></div></div>
</div>

<script>
// ===== KONFIGURASI =====
const HOST = 'localhost:1880';
const API = `http://${HOST}/api`;
const WS_URL = `ws://${HOST}/ws/sensor`;
const API_KEY = 'rahasia123';        // harus sama dengan di flow Node-RED
const HISTORY_PATH = '/history';     // ganti ke '/history/db' setelah Tugas 5

const $ = id => document.getElementById(id);
let hist = [], wsOpen = false, lastRx = 0;

function log(msg, type = 'info') {
  const el = $('log');
  el.innerHTML += `<div class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// Semua request REST membawa header X-API-Key (Tugas 3)
async function api(path, opt = {}) {
  const res = await fetch(API + path, {
    ...opt,
    headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY }
  });
  const json = await res.json();
  if (res.status === 401) throw new Error(json.message);
  return json;
}

// ===== GRAFIK (Tugas 2) =====
const chart = new Chart($('chart'), {
  type: 'line',
  data: { labels: [], datasets: [
    { label: 'Suhu (°C)', data: [], borderColor: '#e8590c', backgroundColor: '#e8590c', tension: .3 },
    { label: 'Kelembaban (%)', data: [], borderColor: '#667eea', backgroundColor: '#667eea', tension: .3 }
  ]},
  options: { animation: false, responsive: true, maintainAspectRatio: false }
});

function render() {
  const last = hist.slice(-20);
  chart.data.labels = last.map(d => new Date(d.received).toLocaleTimeString());
  chart.data.datasets[0].data = last.map(d => d.suhu);
  chart.data.datasets[1].data = last.map(d => d.kelembaban);
  chart.update();

  const rows = hist.slice(-10).reverse().map(d => `
    <tr><td>${new Date(d.received).toLocaleTimeString()}</td><td>${d.suhu}</td><td>${d.kelembaban}</td></tr>`).join('');
  $('history-body').innerHTML = rows || '<tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr>';
}

function showSensor(d) {
  $('suhu').textContent = d.suhu;
  $('kelembaban').textContent = d.kelembaban;
  lastRx = Date.now();
  setStatus(true);
}

function setStatus(online) {
  const b = $('status-badge');
  b.textContent = online ? 'ONLINE' : 'OFFLINE';
  b.className = 'status-badge ' + (online ? 'status-online' : 'status-offline');
}
setInterval(() => { if (lastRx && Date.now() - lastRx > 10000) setStatus(false); }, 2000);

// ===== POLLING (cadangan bila WebSocket putus) =====
async function fetchSensor() {
  try {
    const json = await api('/suhu');
    if (json.status === 'success' && json.data.suhu !== null) showSensor(json.data);
  } catch (e) { log(`Gagal fetch sensor: ${e.message}`, 'error'); }
}
async function fetchHistory() {
  try {
    const json = await api(HISTORY_PATH);
    hist = json.data || [];
    render();
  } catch (e) { log(`Gagal fetch history: ${e.message}`, 'error'); }
}

// ===== WEBSOCKET (Tugas 4) =====
function connectWS() {
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => { wsOpen = true; $('conn').textContent = 'WebSocket'; log('WebSocket terhubung, polling dimatikan'); };
  ws.onclose = () => {
    if (wsOpen) log('WebSocket terputus, kembali ke polling', 'warn');
    wsOpen = false; $('conn').textContent = 'polling';
    setTimeout(connectWS, 3000);
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'sensor') {
      hist.push(m.data); if (hist.length > 50) hist.shift();
      showSensor(m.data); render();
    } else if (m.type === 'alert') {
      showAlert(m.message);
    }
  };
}

// ===== THRESHOLD & NOTIFIKASI (Tugas 1) =====
let alertTimer;
function showAlert(text) {
  const el = $('alert');
  el.textContent = 'Peringatan: ' + text;
  el.style.display = 'block';
  log(text, 'warn');
  clearTimeout(alertTimer);
  alertTimer = setTimeout(() => el.style.display = 'none', 8000);
}
async function loadThreshold() {
  try {
    const json = await api('/threshold');
    if (json.max !== null) $('th-now').textContent = `Batas aktif: ${json.max} °C`;
  } catch (e) { log(`Gagal baca threshold: ${e.message}`, 'error'); }
}
async function setThreshold() {
  const max = parseFloat($('th-input').value);
  if (isNaN(max)) { log('Isi batas suhu dengan angka', 'error'); return; }
  try {
    const json = await api('/threshold', { method: 'PUT', body: JSON.stringify({ max }) });
    if (json.status === 'success') { log(`Batas suhu disimpan: ${json.max} °C`); $('th-now').textContent = `Batas aktif: ${json.max} °C`; }
    else log(`Gagal: ${json.message}`, 'error');
  } catch (e) { log(`Error threshold: ${e.message}`, 'error'); }
}

// ===== KONTROL =====
async function kontrol(device, action) {
  try {
    const json = await api('/kontrol', { method: 'POST', body: JSON.stringify({ device, action }) });
    if (json.status === 'success') log(`Perintah terkirim: ${device} -> ${action}`);
    else log(`Gagal: ${json.message}`, 'error');
  } catch (e) { log(`Error kontrol: ${e.message}`, 'error'); }
}

// ===== START =====
log('Dashboard dimulai');
fetchHistory(); fetchSensor(); loadThreshold(); connectWS();
setInterval(() => { if (!wsOpen) { fetchSensor(); fetchHistory(); } }, 3000);
</script>
</body>
</html>
